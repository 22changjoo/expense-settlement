<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>경비정산</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="경비정산">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-title" id="topbar-title">대시보드</div>
    <div class="topbar-actions">
      <select id="year-select" class="year-select" aria-label="연도 선택"></select>
      <button class="icon-btn" id="refresh-btn" aria-label="새로고침"><i data-lucide="refresh-cw"></i></button>
    </div>
  </header>

  <main id="main">
    <!-- 화면 B. 대시보드 -->
    <section class="view" id="view-dashboard"></section>
    <!-- 화면 C. 지출 목록 -->
    <section class="view" id="view-list" hidden></section>
    <!-- 화면 A. 영수증 업로드 -->
    <section class="view" id="view-upload" hidden></section>
    <!-- 화면 D. 정산 대사 -->
    <section class="view" id="view-settle" hidden></section>
    <!-- 화면 E. 설정 -->
    <section class="view" id="view-settings" hidden></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab is-active" data-view="dashboard"><i data-lucide="layout-dashboard"></i><span>홈</span></button>
    <button class="tab" data-view="list"><i data-lucide="list"></i><span>지출</span></button>
    <button class="tab tab-primary" data-view="upload" aria-label="영수증 등록"><i data-lucide="plus"></i></button>
    <button class="tab" data-view="settle"><i data-lucide="scale"></i><span>정산</span></button>
    <button class="tab" data-view="settings"><i data-lucide="settings"></i><span>설정</span></button>
  </nav>
</div>

<!-- 최초 연결 설정 -->
<div id="onboarding" class="onboarding" hidden>
  <div class="onboarding-card">
    <div class="brand"><i data-lucide="receipt-text"></i></div>
    <h1>경비정산 연결</h1>
    <p class="muted">Apps Script 웹앱 URL 과 접근 토큰을 입력하면 시작합니다. 값은 이 기기에만 저장됩니다.</p>
    <label class="field">
      <span>웹앱 URL</span>
      <input type="url" id="ob-url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
    </label>
    <label class="field">
      <span>접근 토큰</span>
      <input type="text" id="ob-token" placeholder="Apps Script 의 API_TOKEN" autocomplete="off">
    </label>
    <p class="form-error" id="ob-error" hidden></p>
    <button class="btn btn-primary btn-block" id="ob-save">연결하기</button>
  </div>
</div>

<div id="loading" class="loading-overlay" hidden>
  <div class="spinner"></div>
  <p id="loading-text">불러오는 중…</p>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close-sheet></div>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <button class="sheet-grip" id="sheet-grip" aria-label="아래로 끌어 닫기"><span class="sheet-handle"></span></button>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div id="toasts" class="toasts"></div>

<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="api.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
